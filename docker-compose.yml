version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: motek_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - motek_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: motek_server
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/motek_payroll
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - ./solver:/solver
      - /app/node_modules
    networks:
      - motek_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: motek_client
    ports:
      - '3000:3000'
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - motek_network

volumes:
  mongo_data:

networks:
  motek_network:
    driver: bridge
